<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bò chạy bằng 4 núm vú</title>
<style>
  :root { --t: 0.7s; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    padding: 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: #cfe8ff;
    font-family: "Comic Sans MS", cursive;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  h1 { margin: 0 0 8px; color: #d81b60; font-size: clamp(20px, 6vw, 34px); text-align: center; }
  svg {
    width: 100%; max-width: 900px; height: auto; max-height: 70vh;
    background: #eaf6ff; border: 3px dashed #4a7fd1;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .controls { margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 16px; align-items: center; color: #234; width: 100%; max-width: 900px; }
  .controls label { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; }
  .controls input[type=range] { flex: 1; min-width: 0; height: 32px; }
  button { font: inherit; padding: 10px 22px; min-height: 44px; border: 2px solid #234; background: #fff; cursor: pointer; border-radius: 8px; touch-action: manipulation; }
  button:active { background: #ffe3ec; }
  @media (max-height: 450px) and (orientation: landscape) {
    h1 { display: none; }
    svg { max-height: 62vh; }
  }

  .cow    { animation: bob calc(var(--t) / 2) ease-in-out infinite; cursor: pointer; }
  .tail   { transform-origin: 604px 170px; animation: wag calc(var(--t) / 2) ease-in-out infinite alternate; }
  .udder  { transform-origin: 505px 290px; animation: jiggle calc(var(--t) / 2) ease-in-out infinite; }

  .leg    { animation: step var(--t) linear infinite; }

  /* 4 chân thật: quay tròn đều, độc lập với 4 núm vú */
  .real-leg {
    transform-box: fill-box;
    transform-origin: center top;
    animation: legRotate var(--t) linear infinite;
  }
  .real-leg.r2 { animation-delay: calc(var(--t) / -4); }
  .real-leg.r3 { animation-delay: calc(var(--t) / -2); }
  .real-leg.r4 { animation-delay: calc(var(--t) * -0.75); }

  .l1, .l4 { animation-delay: 0s; }
  .l2, .l3 { animation-delay: calc(var(--t) / -2); }
  .l1 { transform-origin: 469px 308px; }
  .l2 { transform-origin: 493px 308px; }
  .l3 { transform-origin: 531px 308px; }
  .l4 { transform-origin: 555px 308px; }

  .shadow { transform-origin: 505px 344px; animation: shadow calc(var(--t) / 2) ease-in-out infinite; }
  .ground { stroke-dasharray: 40 20; animation: scroll var(--t) linear infinite; }
  .dust   { transform-box: fill-box; transform-origin: center; animation: puff var(--t) ease-out infinite; opacity: 0; }
  .dust.b { animation-delay: calc(var(--t) / -2); }
  .speed  { animation: whoosh calc(var(--t) / 1.5) linear infinite; }
  .speed.b { animation-delay: calc(var(--t) / -3); }
  .paused * { animation-play-state: paused !important; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  @keyframes jiggle {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.04, 0.94); }
  }
  @keyframes step {
    0%   { transform: rotate(32deg)  translateY(0); }
    55%  { transform: rotate(-32deg) translateY(0); }
    75%  { transform: rotate(-8deg)  translateY(-16px); }
    100% { transform: rotate(32deg)  translateY(0); }
  }
  @keyframes legRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  @keyframes wag  { from { transform: rotate(-14deg); } to { transform: rotate(18deg); } }
  @keyframes shadow {
    0%, 100% { transform: scale(1); opacity: .35; }
    50%      { transform: scale(.85); opacity: .25; }
  }
  @keyframes scroll { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
  @keyframes puff {
    0%   { opacity: .8; transform: translateX(0) scale(.3); }
    100% { opacity: 0;  transform: translateX(70px) scale(1.6); }
  }
  @keyframes whoosh {
    0%   { transform: translateX(0);    opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateX(160px); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>Bò chạy trên đồng cỏ</h1>

  <svg id="scene" viewBox="0 0 800 400" role="img" aria-label="Con bò chạy bằng 4 núm vú như 4 cái chân">
    <rect x="0" y="340" width="800" height="60" fill="#7bc96f"/>
    <line class="ground" x1="0" y1="340" x2="800" y2="340" stroke="#3b7a2f" stroke-width="5"/>

    <g stroke="#234" stroke-width="4" stroke-linecap="round">
      <line class="speed"   x1="640" y1="150" x2="700" y2="150"/>
      <line class="speed b" x1="650" y1="210" x2="720" y2="210"/>
      <line class="speed"   x1="630" y1="260" x2="690" y2="260"/>
    </g>

    <circle class="dust"   cx="575" cy="328" r="15" fill="#b9a382"/>
    <circle class="dust b" cx="590" cy="322" r="11" fill="#c9b594"/>

    <ellipse class="shadow" cx="505" cy="346" rx="75" ry="7" fill="#000"/>

    <g class="cow" id="cow" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <g class="tail" fill="none">
        <path d="M604 170 C625 175 635 230 622 285"/>
        <path d="M622 285 l-6 22 M622 285 l2 24 M622 285 l10 20" stroke-width="3"/>
      </g>

      <g class="leg l1"><rect x="462" y="306" width="14" height="36" rx="7" fill="#ffb3c1"/></g>
      <g class="leg l2"><rect x="486" y="306" width="14" height="36" rx="7" fill="#ffb3c1"/></g>
      <g class="leg l3"><rect x="524" y="306" width="14" height="36" rx="7" fill="#ffb3c1"/></g>
      <g class="leg l4"><rect x="548" y="306" width="14" height="36" rx="7" fill="#ffb3c1"/></g>

      <!-- 4 chân thật, quay tròn đều -->
      <g class="real-leg r2" transform="rotate(0 330 275)">
        <rect x="323" y="270" width="14" height="68" rx="6" fill="#fff"/>
        <rect x="322" y="330" width="16" height="10" rx="4" fill="#222"/>
      </g>
<g class="real-leg r4" transform="rotate(0 525 275)">
        <rect x="518" y="270" width="14" height="68" rx="6" fill="#fff"/>
        <rect x="517" y="330" width="16" height="10" rx="4" fill="#222"/>
      </g>

      <path fill="#fff" d="M172 140 C260 120 400 120 500 130 C570 130 610 170 605 230
                          C600 275 560 290 500 290 L260 290 C210 290 185 250 172 215 Z"/>
      <path fill="#222" stroke="none" d="M300 150 q30 -12 55 5 q10 30 -25 40 q-35 0 -30 -45z"/>
      <path fill="#222" stroke="none" d="M470 200 q40 -20 60 10 q5 40 -35 42 q-35 -10 -25 -52z"/>

      <path fill="#fff" d="M172 140 L120 148 L78 185 L74 212 L108 222 L150 208 L172 215 Z"/>
      <path fill="#fff" d="M118 148 q-2 -28 22 -28 q14 8 -2 30z"/>
      <path fill="none" d="M84 128 q-14 -22 10 -20 q10 4 16 20"/>
      <circle cx="102" cy="172" r="5" fill="#111"/>
      <ellipse cx="80" cy="203" rx="4" ry="6" fill="#111" stroke="none"/>
      <path fill="#ff6f91" d="M92 222 q4 26 16 22 q8 -8 4 -22z"/>

      <!-- 2 chân thật hiện lên phía trước thân (r1: chân trước, r3: chân sau) -->
      <g class="real-leg r1" transform="rotate(0 245 275)">
        <rect x="238" y="270" width="14" height="68" rx="6" fill="#fff"/>
        <rect x="237" y="330" width="16" height="10" rx="4" fill="#222"/>
      </g>
      <g class="real-leg r3" transform="rotate(0 440 275)">
        <rect x="433" y="270" width="14" height="68" rx="6" fill="#fff"/>
        <rect x="432" y="330" width="16" height="10" rx="4" fill="#222"/>
      </g>

      <ellipse class="udder" cx="505" cy="298" rx="62" ry="22" fill="#ffc9d4"/>
    </g>

    <text id="moo" x="90" y="80" font-size="30" fill="#d81b60" font-family="Comic Sans MS, cursive" opacity="0">Mooo!!!</text>
  </svg>

  <div class="controls">
    <label>Tốc độ
      <input id="speed" type="range" min="1" max="10" value="5">
    </label>
    <button id="toggle">Dừng</button>
  </div>

<script>
  const root = document.documentElement;
  const scene = document.getElementById('scene');
  const slider = document.getElementById('speed');
  const toggle = document.getElementById('toggle');
  const moo = document.getElementById('moo');

  function setSpeed() {
    const s = Number(slider.value);
    root.style.setProperty('--t', (1.5 - s * 0.13).toFixed(2) + 's');
  }
  slider.addEventListener('input', setSpeed);
  setSpeed();

  toggle.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    toggle.textContent = paused ? 'Chạy' : 'Dừng';
  });

  let audioCtx;
  function playMoo() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const dur = 1.3;

    // Giọng: sóng răng cưa, cao độ trượt lên rồi hạ xuống như tiếng bò
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, t0);
    osc.frequency.linearRampToValueAtTime(150, t0 + 0.25);
    osc.frequency.linearRampToValueAtTime(130, t0 + 0.8);
    osc.frequency.linearRampToValueAtTime(85, t0 + dur);

    // Rung nhẹ cho tự nhiên
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 6;
    lfoGain.gain.value = 4;
    lfo.connect(lfoGain).connect(osc.frequency);

    // Bộ lọc "o-o-oa": miệng khép (o) rồi mở (a) rồi khép lại
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 4;
    filter.frequency.setValueAtTime(350, t0);
    filter.frequency.linearRampToValueAtTime(700, t0 + 0.6);
    filter.frequency.linearRampToValueAtTime(300, t0 + dur);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(1.2, t0 + 0.1);
    gain.gain.setValueAtTime(1.2, t0 + dur - 0.35);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(filter).connect(gain).connect(audioCtx.destination);
    osc.start(t0); lfo.start(t0);
    osc.stop(t0 + dur); lfo.stop(t0 + dur);
  }

  document.getElementById('cow').addEventListener('click', () => {
    playMoo();
    moo.setAttribute('opacity', 1);
    setTimeout(() => moo.setAttribute('opacity', 0), 1300);
  });
</script>
</body>
</html>
